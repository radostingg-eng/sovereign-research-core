name: Sovereign Profile Host Cycle

# The ChatGPT host commits one candidate to host_staging/. This profile-owned
# workflow validates it with the exact pinned core, executes only accepted
# bytes, verifies the private journal, and publishes feedback. The shared core
# never receives write access to this profile.
on:
  schedule:
    # Every 2 hours (minute 50, even hours). Worst observed GitHub cron
    # delay is well under an hour, so the newest watchdog_heartbeat stays
    # comfortably under the 4.0h alarm threshold in
    # runtime.schedule_ledger.check_watchdog_heartbeat. Halves the account-
    # schedule job's monthly runs (720 -> 360) without weakening the alarm.
    - cron: '50 */2 * * *'
  push:
    branches: [main]
    paths:
      - "host_staging/**"
      - "!host_staging/FEEDBACK.json"
  workflow_dispatch:

concurrency:
  group: sovereign-profile-host-cycle
  cancel-in-progress: false

permissions:
  contents: write

env:
  PROFILE_WORKFLOW_VERSION: '2'
  PYTHONSAFEPATH: '1'

jobs:
  cycle:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'push' ||
      github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/.core
      SOVEREIGN_PROFILE_DIR: ${{ github.workspace }}
    steps:
      - name: Check out private profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse public profiles and code shadowing
        run: |
          test "${{ github.event.repository.private }}" = "true" || {
            echo "profile repository must be private"
            exit 1
          }
          for path in runtime ops conftest.py .core; do
            test ! -e "$path" || {
              echo "profile code shadow present: $path"
              exit 1
            }
          done

      - name: Read and validate pinned core
        id: core
        run: |
          python3 -P - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("core.lock").read_text(encoding="utf-8"))
          repo = lock.get("core_repo")
          commit = lock.get("commit")
          if repo != "radostingg-eng/sovereign-research-core":
              raise SystemExit(f"unexpected core repo: {repo!r}")
          if not isinstance(commit, str) or re.fullmatch("[0-9a-f]{40}", commit) is None:
              raise SystemExit("core.lock must contain a full 40-character commit SHA")
          if lock.get("profile_workflow_version") != 2:
              raise SystemExit("core.lock requires profile_workflow_version 2")
          print(f"repo={repo}")
          print(f"commit={commit}")
          PY

      - name: Check out pinned shared core read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repo }}
          ref: ${{ steps.core.outputs.commit }}
          path: .core
          persist-credentials: false

      - name: Verify pinned contracts before reading private input
        run: |
          python3 -P -m runtime.profile_health
          python3 -P -m runtime.prompt_invariants
          python3 -P -m runtime.schema_invariants

      - name: Validate staged candidate
        id: intake
        run: |
          set -o pipefail
          rc=0
          python3 -P -m runtime.staged_intake \
            --staging-dir host_staging \
            --input-dir host_input \
            --refresh-feedback 2>&1 | tee validation.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          promoted="$(grep -c ': promoted$' validation.log || true)"
          echo "promoted=$promoted" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            exit "$rc"
          fi

      - name: Execute or finalize accepted inputs
        run: |
          journal="$(find audit -maxdepth 1 -name '*.jsonl' -type f | sort | tail -1)"
          test -n "$journal"
          python3 -P -m runtime.run_host_cycle \
            --input-dir host_input \
            --journal "$journal"

      - name: Verify private journal and profile gates
        run: |
          journal="$(find audit -maxdepth 1 -name '*.jsonl' -type f | sort | tail -1)"
          python3 -P - "$journal" <<'PY'
          import sys
          from runtime.audit_store import AuditJournal

          result = AuditJournal(sys.argv[1]).validate()
          if not result["valid"]:
              raise SystemExit(result)
          print(f"journal valid: {result['records']} records")
          PY
          python3 -P -m runtime.profile_health
          python3 -P -m runtime.archive_integrity
          python3 -P -m runtime.coordination
          python3 -P -m runtime.tool_artifacts

      - name: Verify host-cycle liveness
        if: steps.intake.outputs.promoted != '0'
        run: python3 -P -m runtime.liveness

      - name: Alarm if the schedule watchdog is silent
        if: always()
        run: >-
          python3 -P -m runtime.schedule_ledger
          --profile-root .
          --check-heartbeat-only

      - name: Publish promotion, refusal, receipt, and feedback
        run: |
          git config user.name "sovereign-profile-runtime"
          git config user.email "noreply@github.com"
          git add -A host_staging host_input audit coordination
          if [ -d tool_artifacts ]; then
            git add -A tool_artifacts/
          fi
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "runtime: validate and execute host cycle"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if git rebase origin/main; then
              python3 -P -m runtime.staged_intake \
                --input-dir host_input \
                --verify-canonical
              python3 -P -m runtime.profile_health
              python3 -P -m runtime.tool_artifacts
            fi
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt * 2))"
          done
          echo "profile publication failed after 3 attempts"
          exit 1

      - name: Report handled refusal
        if: steps.intake.outputs.rc == '2'
        run: |
          echo "::notice::Candidate refused safely."
          echo "::notice::Read host_staging/FEEDBACK.json on the next host run."

  account-schedule:
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/.core
      SOVEREIGN_PROFILE_DIR: ${{ github.workspace }}
    steps:
      - name: Check out current private profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh repository state after cycle job
        run: git pull --rebase --quiet origin main

      - name: Read pinned core
        id: core
        run: |
          python3 -P - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("core.lock").read_text(encoding="utf-8"))
          repo = lock.get("core_repo")
          commit = lock.get("commit")
          if repo != "radostingg-eng/sovereign-research-core":
              raise SystemExit(f"unexpected core repo: {repo!r}")
          if not isinstance(commit, str) or re.fullmatch("[0-9a-f]{40}", commit) is None:
              raise SystemExit("core.lock must contain a full 40-character commit SHA")
          if lock.get("profile_workflow_version") != 2:
              raise SystemExit("core.lock requires profile_workflow_version 2")
          print(f"repo={repo}")
          print(f"commit={commit}")
          PY

      - name: Check out pinned shared core read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repo }}
          ref: ${{ steps.core.outputs.commit }}
          path: .core
          persist-credentials: false

      - name: Account for matured schedule slots
        id: watchdog
        run: |
          rc=0
          python3 -P -m runtime.schedule_ledger \
            --profile-root . \
            --workflow-version 2 \
            --json > schedule-watchdog-report.json || rc=$?
          cat schedule-watchdog-report.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish schedule evidence
        run: |
          if [ ! -f runs/SCHEDULE_EVENTS.jsonl ]; then
            exit 0
          fi
          git config user.name "sovereign-schedule-watchdog"
          git config user.email "noreply@github.com"
          git add runs/SCHEDULE_EVENTS.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -q -m "audit: account for scheduled host slots"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if git rebase origin/main; then
              python3 -P -c \
                'from runtime.audit_store import AuditJournal; assert AuditJournal("runs/SCHEDULE_EVENTS.jsonl").validate()["valid"]'
            fi
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt * 2))"
          done
          echo "schedule evidence publication failed after 3 attempts"
          exit 1

      - name: Fail on an active schedule incident
        if: steps.watchdog.outputs.rc != '0'
        run: |
          echo "::error::Schedule accounting found a missing, refused,"
          echo "::error::incomplete, stale-source, or backlogged slot."
          exit 1
