name: Host Cycle Executor (fallback)

# The primary executor is a launchd agent on the operator's laptop, polling
# every ten minutes. It is free and fast, but it does not run while the
# machine is asleep, and launchd will not wake it. The host keeps committing
# regardless, because it runs server-side, so a closed lid means inputs queue
# up undrained.
#
# This is the safety net, not a second primary. It runs on a schedule and
# executes ONLY inputs the laptop has already had its chance at, enforced by
# --min-input-age-minutes. Both executors append to one hash chain, and two
# writers picking the same parent is how an append-only journal forks
# irreversibly; the age gate is what keeps them from ever contending for the
# same cycle.
#
# Deliberately NOT triggered on push to host_input/**. A push-triggered run
# fires the instant the host commits, which is precisely when the laptop is
# most likely to also be working on it, and waiting out the age gate inside
# the job would bill for the sleep.

on:
  schedule:
    # Hourly at :35. Offset from both the host's commit times and the
    # laptop's ten-minute poll so a cold start does not coincide with either.
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      min_age_minutes:
        description: >-
          Minimum input age before this executor will touch it. Lower it only
          when the laptop is known to be off; 0 disables the guard entirely
          and can race the primary executor.
        required: false
        default: '20'

# Never two of these at once. They would both append to the journal.
concurrency:
  group: host-cycle-executor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: input_age_minutes reads each file's commit time, and
          # a shallow clone has no commits to read it from, which would make
          # every input look unmeasurable and defeat the age gate.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute any cycle the laptop did not
        id: run
        env:
          MIN_AGE: ${{ github.event.inputs.min_age_minutes || '20' }}
        run: |
          set -o pipefail
          # The runner exits non-zero when it sees a refusal it has not
          # recorded before, and that can happen in the same pass that
          # persisted a perfectly good cycle. Steps run under `bash -e`, so
          # failing here would abandon the other cycles' receipts unpublished.
          # The code is carried to the end of the job instead, where it still
          # fails the run after the good work has been committed.
          rc=0
          python3 -m runtime.run_host_cycle \
            --input-dir host_input \
            --min-input-age-minutes "$MIN_AGE" 2>&1 | tee run.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Verify the journal before publishing anything
        # The runtime's own gate. Pushing a receipt onto a chain that does not
        # verify would spread the damage to the remote, where the host reads.
        run: python3 -m runtime.integrity

      - name: Commit receipts and host feedback
        run: |
          git config user.name "sovereign-executor"
          git config user.email "noreply@github.com"
          # Stage BEFORE testing. `git diff` cannot see an untracked file, so
          # a newly created FEEDBACK.json was invisible and this step reported
          # "nothing to publish" while holding exactly the thing it was meant
          # to publish. That is the shape of failure this whole loop exists to
          # prevent: a green run that silently did nothing.
          git add -A audit/
          if [ -f host_input/FEEDBACK.json ]; then
            git add host_input/FEEDBACK.json
          fi
          if git diff --cached --quiet; then
            echo "nothing to publish; the laptop had already drained this"
            exit 0
          fi
          git commit -q -m "audit: persist cycle result and host feedback

          Executed by the fallback runner because the primary executor did
          not take these inputs within the age window."
          # The laptop may have pushed while this ran. Rebase and re-check
          # rather than force anything: a duplicate receipt for one cycle is
          # exactly the corruption the age gate exists to prevent, so if the
          # rebase reveals the cycle already landed, this run's work is
          # discarded rather than published on top.
          git pull --rebase --quiet || {
            echo "rebase conflicted; the primary executor got there first"
            exit 0
          }
          python3 -m runtime.integrity
          git push --quiet

      - name: Report what happened
        if: always()
        run: cat run.log || true

      - name: Alarm if the loop has stalled
        # Runs on the hourly schedule, so this is the thing that notices when
        # the host stops committing, or stops recovering from its feedback,
        # or the laptop sleeps and this fallback is the only executor left.
        # A failing workflow emails the operator, which turns silence into a
        # signal. Every other part of this system reports to something;
        # without this, going quiet was indistinguishable from being healthy.
        if: always()
        run: python3 -m runtime.liveness

      - name: Fail the run if an input was refused
        # Last, so a refusal is still an alarm without costing the cycles
        # that succeeded alongside it their receipts.
        if: steps.run.outputs.rc != '0'
        run: |
          echo "::error::An input was refused. See run.log above and"
          echo "::error::host_input/FEEDBACK.json for what the host must fix."
          exit 1
